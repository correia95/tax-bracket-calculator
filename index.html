    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What's the difference between marginal and effective tax rate?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Marginal rate is the rate on your last dollar of income — the bracket your top dollar falls into. Effective rate is your total tax divided by your total income, almost always lower than the marginal rate, since only the income within each bracket is taxed at that bracket's rate."
            }
          },
          {
            "@type": "Question",
            "name": "Are the example brackets the current official rates?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The presets are a labeled illustrative example (2024 US federal brackets), not a guarantee of the current year's official numbers, since brackets are adjusted for inflation annually. Every bracket is editable so you can enter current figures or a different country's brackets."
            }
          },
          {
            "@type": "Question",
            "name": "Is this tax advice?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. This is a calculator for understanding how progressive tax brackets work, not tax advice. Always verify current figures and consult a tax professional for your actual filing."
            }
          },
          {
            "@type": "Question",
            "name": "Is my data sent to a server?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Every calculation runs in your browser and is only stored in the page's own link."
            }
          }
        ]
      }
